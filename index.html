<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>隐私政策管理台</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44"><rect width="44" height="44" rx="9" fill="%23B23B2E"/><text x="22" y="31" text-anchor="middle" font-size="23" fill="%23F6F4EC" font-family="serif" font-weight="900">隐</text></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F3EC; --panel:#FFFFFF; --panel-2:#FAF8F2;
  --ink:#1C2740; --ink-2:#5A6478; --ink-3:#8B94A7;
  --line:#E5E0D2; --line-2:#D8D2C1;
  --navy:#1F3A66; --navy-2:#2C4E85;
  --side:#152239; --side-tx:#C7D1E3;
  --gold:#B98A2F; --gold-soft:#F5EBD4;
  --red:#B23B2E; --red-soft:#F8E9E5; --red-line:#E2C3BC;
  --green:#2E7D52; --green-soft:#E5F1EA; --green-line:#BFDDCB;
  --amber:#9A6B1F; --amber-soft:#F6EDD8; --amber-line:#E4D2AC;
  --serif:'Noto Serif SC',Georgia,'Songti SC','SimSun',serif;
  --sans:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--navy)}
::selection{background:var(--gold-soft)}
.hide{display:none!important}
.ic{vertical-align:-2px;flex:none}
button{font-family:inherit}

/* ---------- 通用组件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:7px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--navy);color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2);color:#fff}
.btn-danger{color:var(--red);border-color:var(--red-line)}
.btn-danger:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn-sm{height:27px;padding:0 10px;font-size:12px;border-radius:6px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:rgba(31,58,102,.08);color:var(--navy);border-color:transparent}
.btn-block{width:100%;height:40px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:4px;font-size:11.5px;font-weight:600;border:1px solid;white-space:nowrap;cursor:default}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip-ok{color:var(--green);border-color:var(--green-line);background:var(--green-soft)}
.chip-bad{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
.chip-unk{color:var(--ink-3);border-color:var(--line-2);background:#F2EFE6}
.chip-warn{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)}
.chip-tag{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field .hint{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.field .hint a{color:var(--navy)}
input[type=text],input[type=password],input[type=url],input[type=number],select,textarea{width:100%;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:7px;background:#fff;font-size:13.5px;font-family:inherit;color:var(--ink);transition:border .15s, box-shadow .15s}
textarea{height:auto;padding:10px 12px}
input.mono,select.mono{font-family:var(--mono);font-size:12.5px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(31,58,102,.12)}
input.err,textarea.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(178,59,46,.1)}
.form-err{color:var(--red);font-size:12.5px;min-height:18px;margin-top:10px}
.empty{border:1.5px dashed var(--line-2);border-radius:12px;padding:52px 24px;text-align:center;color:var(--ink-2);background:rgba(255,255,255,.55)}
.empty .ic{opacity:.4}
.empty h3{font-family:var(--serif);font-size:17px;color:var(--ink);margin:14px 0 6px}
.empty p{font-size:13px;color:var(--ink-2);margin-bottom:18px}
.sep{border:none;border-top:1px solid var(--line);margin:18px 0}

/* ---------- 登录 / 初始化 ---------- */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(28,39,64,.045) 31px 32px),repeating-linear-gradient(90deg,transparent 0 31px,rgba(28,39,64,.03) 31px 32px),var(--paper)}
.gate-card{width:430px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:38px 38px 30px;box-shadow:0 30px 70px -34px rgba(21,34,57,.45);animation:up .3s ease}
.gate-brand{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.gate-brand h1{font-family:var(--serif);font-size:23px;font-weight:900;letter-spacing:1px}
.gate-brand .en{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--ink-3);margin-top:2px}
.gate-sub{font-size:13px;color:var(--ink-2);margin:14px 0 26px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.steps{display:flex;gap:8px;margin-bottom:24px}
.steps span{flex:1;text-align:center;font-size:11.5px;color:var(--ink-3);padding-bottom:8px;border-bottom:2px solid var(--line)}
.steps span.on{color:var(--navy);border-color:var(--gold);font-weight:600}
.qr-box{display:flex;gap:22px;align-items:center;justify-content:center;padding:18px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;flex-wrap:wrap}
.qr-box .img{background:#fff;padding:10px;border:1px solid var(--line);border-radius:8px}
.qr-box img,.qr-box canvas{display:block}
.qr-fallback{width:150px;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);word-break:break-all;line-height:1.6}
.secret-key{font-family:var(--mono);font-size:14px;letter-spacing:2.5px;background:var(--panel-2);border:1px dashed var(--line-2);border-radius:8px;padding:12px 14px;text-align:center;user-select:all;margin:10px 0}
.totp-input{font-family:var(--mono);font-size:24px !important;letter-spacing:14px;text-align:center;height:52px;font-weight:600}
.gate-note{font-size:11.5px;color:var(--ink-3);line-height:1.7;margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .3s}

/* ---------- 主框架 ---------- */
.shell{display:flex;min-height:100vh}
.side{width:238px;flex:none;background:var(--side);color:var(--side-tx);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-brand{display:flex;align-items:center;gap:11px;padding:22px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-brand .t{font-family:var(--serif);font-size:16.5px;font-weight:700;color:#F2F0E8;letter-spacing:1px;line-height:1.3}
.side-brand .e{font-family:var(--mono);font-size:8.5px;letter-spacing:2.5px;color:rgba(199,209,227,.5);margin-top:2px}
.side nav{padding:14px 12px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:10.5px 13px;border-radius:8px;color:var(--side-tx);font-size:13.5px;cursor:pointer;margin-bottom:3px;border-left:3px solid transparent;transition:all .15s;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.on{background:rgba(255,255,255,.09);color:#fff;border-left-color:var(--gold)}
.nav-item .bdg{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:rgba(178,59,46,.9);color:#fff;border-radius:9px;padding:0 7px;height:17px;line-height:17px}
.side-foot{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px}
.side-foot .clock{font-family:var(--mono);color:#F2F0E8;font-size:12.5px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.side-foot .lockbtn{display:flex;align-items:center;gap:7px;color:var(--side-tx);cursor:pointer;font-size:12.5px}
.side-foot .lockbtn:hover{color:#fff}
.side-foot .ver{margin-top:12px;color:rgba(199,209,227,.4);font-family:var(--mono);font-size:10px;letter-spacing:1px}
.main{flex:1;min-width:0;padding:30px 36px 60px;max-width:1220px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:12px}
.page-head .sub{color:var(--ink-2);font-size:13px;margin-top:7px}
.page-head .acts{display:flex;gap:10px;flex-wrap:wrap}
.view{animation:fadein .2s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 统计条 / 表格 ---------- */
.stats{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:22px;flex-wrap:wrap}
.stat{flex:1;min-width:150px;padding:18px 24px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .k{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.stat .v{font-family:var(--serif);font-size:31px;font-weight:700;margin-top:5px;line-height:1.1}
.stat .v small{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-weight:400;margin-left:6px}
.stat.bad .v{color:var(--red)}
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto}
table.lg{width:100%;border-collapse:collapse;min-width:760px}
.lg th{font-size:12px;color:var(--ink-2);font-weight:600;text-align:left;padding:11px 16px;background:var(--panel-2);border-bottom:1px solid var(--line);white-space:nowrap}
.lg td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.lg tbody tr:last-child td{border-bottom:none}
.lg tbody tr[data-open]{cursor:pointer;transition:background .12s}
.lg tbody tr[data-open]:hover{background:var(--panel-2)}
tr.row-bad{background:linear-gradient(90deg,rgba(178,59,46,.07),transparent 32%)}
tr.row-bad td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.app-name{font-weight:600;font-size:14px}
.app-name small{display:block;font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:400;margin-top:2px}
.url-cell{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.url-cell a{text-decoration:none;font-family:var(--mono);font-size:11.5px}
.url-cell a:hover{text-decoration:underline}
.row-acts{display:flex;gap:6px;justify-content:flex-end}
.snap-v{font-family:var(--mono);font-weight:600;color:var(--navy);background:var(--gold-soft);border:1px solid #E8D9B0;border-radius:5px;padding:2px 8px;font-size:12px}
.src-chip{font-size:11px;border-radius:4px;padding:2px 8px;border:1px solid;white-space:nowrap}
.src-up{color:var(--navy);border-color:#C9D6EC;background:#EDF2FA}
.src-fetch{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)}
.hash{font-family:var(--mono);font-size:11px;color:var(--ink-3);cursor:copy}

/* ---------- 概览 ---------- */
.ov-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.panel h2{font-family:var(--serif);font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.panel h2 .ic{color:var(--gold)}
.act-item{display:flex;gap:12px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:12.5px;align-items:baseline}
.act-item:last-child{border-bottom:none}
.act-item .t{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none;width:132px}
.act-item .tag{flex:none;font-size:10.5px;border:1px solid var(--line-2);border-radius:3px;padding:0 5px;color:var(--ink-2);background:var(--panel-2)}
.fail-panel{border-color:var(--red-line);background:linear-gradient(180deg,var(--red-soft),#fff 60%);margin-bottom:22px}
.fail-panel h2{color:var(--red)}
.fail-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--red-line);font-size:13px}
.fail-item:last-child{border-bottom:none}

/* ---------- 快照选择 / 对比 ---------- */
.cmpbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;border-radius:10px;padding:10px 12px 10px 20px;display:flex;gap:14px;align-items:center;box-shadow:0 16px 40px -12px rgba(21,34,57,.6);z-index:60;animation:up .2s}
.cmpbar .mono{color:var(--gold)}
.tabs{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:4px;width:max-content;margin-bottom:16px}
.tabs button{border:none;background:transparent;padding:6px 16px;border-radius:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(21,34,57,.14)}
.sbs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sbs .col h4{font-size:12px;color:var(--ink-2);margin-bottom:8px;display:flex;justify-content:space-between}
.sbs iframe,.prev-frame{width:100%;height:480px;border:1px solid var(--line);border-radius:9px;background:#fff}
.diff{font-family:var(--mono);font-size:12px;line-height:1.75;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.diff .ln{display:flex}
.diff .ln .no{width:46px;flex:none;text-align:right;padding-right:10px;color:var(--ink-3);user-select:none;background:var(--panel-2);border-right:1px solid var(--line)}
.diff .ln .tx{padding:0 14px;white-space:pre-wrap;word-break:break-all;flex:1;min-width:0}
.diff .ln.plus{background:#E9F4EC}.diff .ln.plus .tx{color:#1E5B38}
.diff .ln.minus{background:#F9E9E6}.diff .ln.minus .tx{color:#8C2F24}
.diff .gap{padding:4px 14px;color:var(--ink-3);background:var(--panel-2);font-size:11px;text-align:center;border-top:1px dashed var(--line-2);border-bottom:1px dashed var(--line-2)}
.cmp-meta{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cmp-meta .chip-add{color:#1E5B38;border-color:#BFDCC9;background:#E9F4EC}
.cmp-meta .chip-del{color:#8C2F24;border-color:var(--red-line);background:#F9E9E6}

/* ---------- 弹窗 / 提示 ---------- */
.mask{position:fixed;inset:0;background:rgba(21,32,53,.46);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;animation:fade .15s;padding:20px}
.modal{background:#fff;border-radius:14px;border:1px solid var(--line);width:560px;max-width:100%;max-height:calc(100vh - 48px);display:flex;flex-direction:column;animation:pop .18s;box-shadow:0 40px 90px -30px rgba(21,34,57,.5)}
.modal.w-lg{width:980px}
.modal.w-md{width:680px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:17px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{font-family:var(--serif);font-size:17px;font-weight:700;display:flex;align-items:center;gap:9px}
.modal-b{padding:22px;overflow:auto}
.modal-f{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;align-items:center}
.modal-f .left{margin-right:auto;color:var(--ink-3);font-size:12px;display:flex;align-items:center;gap:6px}
.x-btn{border:none;background:transparent;cursor:pointer;color:var(--ink-3);padding:4px;border-radius:6px;display:flex}
.x-btn:hover{background:var(--panel-2);color:var(--ink)}
#toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:300;align-items:center}
.toast{background:#1A2537;color:#EDF0F6;padding:10px 20px;border-radius:9px;font-size:13px;box-shadow:0 12px 32px -10px rgba(0,0,0,.45);animation:up .22s;display:flex;gap:8px;align-items:center;max-width:80vw}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line-2);border-top-color:var(--navy);border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- 设置 ---------- */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.set-grid .panel.wide{grid-column:1/-1}
.kv{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13px;gap:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-2)}
.usage-bar{height:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.usage-bar i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .3s}
.usage-bar i.hot{background:var(--amber)}
.usage-bar i.full{background:var(--red)}
.note{font-size:12px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:7px;padding:11px 14px;line-height:1.8}
.chain-res{margin-top:14px}
.chain-res .kv .mono{color:var(--ink)}

/* ---------- 响应式 ---------- */
@media (max-width:960px){
  .shell{flex-direction:column}
  .side{width:100%;height:auto;position:static}
  .side nav{display:flex;overflow-x:auto;padding:8px 10px}
  .nav-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;margin-bottom:0}
  .nav-item.on{border-bottom-color:var(--gold)}
  .side-foot{display:flex;justify-content:space-between;align-items:center}
  .side-foot .ver{display:none}
  .main{padding:22px 16px 50px}
  .ov-grid,.set-grid{grid-template-columns:1fr}
  .sbs{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- 登录 / 初始化 -->
<div id="gate" class="gate"><div class="gate-card" id="gate-card"></div></div>

<!-- 主界面 -->
<div id="shell" class="shell hide">
  <aside class="side">
    <div class="side-brand">
      <svg width="38" height="38" viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="9" fill="#B23B2E"/><text x="22" y="31" text-anchor="middle" font-size="23" fill="#F6F4EC" font-family="Noto Serif SC,serif" font-weight="900">隐</text></svg>
      <div><div class="t">隐私政策管理台</div><div class="e">PRIVACY REGISTRY</div></div>
    </div>
    <nav>
      <div class="nav-item" data-go="#/overview" id="nav-overview"><span data-ic="grid"></span>概览</div>
      <div class="nav-item" data-go="#/apps" id="nav-apps"><span data-ic="phone"></span>应用管理<span class="bdg hide" id="badg-bad"></span></div>
      <div class="nav-item" data-go="#/snaps" id="nav-snaps"><span data-ic="archive"></span>快照库</div>
      <div class="nav-item" data-go="#/settings" id="nav-settings"><span data-ic="sliders"></span>设置</div>
    </nav>
    <div class="side-foot">
      <div class="clock"><span data-ic="clock"></span><span id="clock">—</span></div>
      <div class="lockbtn" data-act="lock"><span data-ic="lock"></span>锁定管理台</div>

  localStorage.setItem(AUTH_KEY,JSON.stringify({v:1,alg:'env1',salt:b64(salt),iterations:ITER,verifier:b64(d.verifier),totp:box}));}

/* ================= 链接检测 ================= */
const PROXIES=[
  {build:u=>'https://api.allorigins.win/get?url='+encodeURIComponent(u),
   parse:async r=>{const j=await r.json();const c=(j.status&&j.status.http_code)||0;return{ok:c>=200&&c<400,status:c,text:(c>=200&&c<400)?j.contents:null};}},
  {build:u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
   parse:async r=>({ok:r.ok,status:r.status,text:r.ok?await r.text():null})},
];
const T=ms=>AbortSignal.timeout(ms);
async function proxyFetch(url){for(const p of PROXIES){try{const r=await fetch(p.build(url),{signal:T(22000)});if(!r.ok)continue;return await p.parse(r);}catch(e){}}return null;}

const checking=new Set();
async function checkApp(app,silent){
  if(checking.has(app.id))return app.lastCheck;checking.add(app.id);setStatusCell(app.id,'checking');
  let res=null;
  try{
    try{const r=await fetch(app.url,{mode:'cors',cache:'no-store',signal:T(13000)});
      res={ok:r.ok,status:r.status,via:'direct'};
      if(r.ok){const t=await r.text();if(await maybeSnapshot(app,t)&&!silent)toast(`「${app.name}」在线内容已变更，自动生成新快照`);}}catch(e){}
    if(!res){try{await fetch(app.url,{mode:'no-cors',cache:'no-store',signal:T(13000)});res={ok:true,status:0,via:'opaque'};}catch(e){}}
    if(!res){const p=await proxyFetch(app.url);if(p)res={ok:p.ok,status:p.status,via:'proxy'};
      if(p&&p.ok&&p.text&&/<[a-z!]/i.test(p.text)){if(await maybeSnapshot(app,p.text)&&!silent)toast(`「${app.name}」在线内容已变更，自动生成新快照`);}}
    if(!res)res={ok:false,status:0,via:'none'};
  }finally{checking.delete(app.id);}
  app.lastCheck={at:Date.now(),ok:res.ok,status:res.status,via:res.via};
  saveDb();setStatusCell(app.id);updateBadg();
  return app.lastCheck;}
async function checkAll(silent){
  const apps=[...db.apps];let okc=0,badc=0;
  for(const a of apps){const r=await checkApp(a,true);r&&r.ok?okc++:badc++;}
  db.lastCheckAt=Date.now();saveDb();
  if(!silent)toast(`检测完成：${okc} 个正常，${badc} 个异常`,badc?'err':'ok');
  if(location.hash.startsWith('#/overview'))render();
  return {okc,badc};}
function maybeCheckAll(){const iv=(db.settings.intervalMin||30)*60000;
  if(db.apps.length&&Date.now()-(db.lastCheckAt||0)>iv){logAct('check','打开平台自动触发全量链接检测');checkAll(false);}}

/* ================= 快照 ================= */
const snapsOf=appId=>db.snapshots.filter(s=>s.appId===appId).sort((a,b)=>a.version-b.version);
const latestSnap=appId=>{const ss=snapsOf(appId);return ss.length?ss[ss.length-1]:null;};
async function createSnapshot(app,content,source){
  const last=latestSnap(app.id);const version=(last?last.version:0)+1;
  const contentHash=await sha256Hex(content);
  const chainHash=await sha256Hex((last?last.chainHash:'GENESIS')+'|'+app.id+'|'+version+'|'+Date.now()+'|'+contentHash);
  db.snapshots.push({id:uid(),appId:app.id,version,at:Date.now(),source,content,contentHash,chainHash,size:new Blob([content]).size});
  app.updatedAt=Date.now();
  logAct('snapshot',`${source==='upload'?'上传':'在线抓取'}了「${app.name}」的 V${String(version).padStart(3,'0')} 快照`);
  saveDb();return version;}
async function rebuildChain(appId){let prev='GENESIS';
  for(const s of snapsOf(appId)){s.chainHash=await sha256Hex(prev+'|'+s.appId+'|'+s.version+'|'+s.at+'|'+s.contentHash);prev=s.chainHash;}}
async function verifyChains(){const out=[];
  for(const app of db.apps){const ss=snapsOf(app.id);let ok=true,bad=null,prev='GENESIS';
    for(const s of ss){
      if(await sha256Hex(s.content)!==s.contentHash){ok=false;bad=s;break;}
      const h=await sha256Hex(prev+'|'+s.appId+'|'+s.version+'|'+s.at+'|'+s.contentHash);
      if(h!==s.chainHash){ok=false;bad=s;break;}
      prev=s.chainHash;}
    out.push({app,ok,bad});}
  return out;}

/* ================= TOTP 二次验证门 ================= */
let totpFails=0;
function gate(action,label){
  if(!authed())return;
  const until=lockGet('ppm.tlock');
  const left=until-Date.now();
  if(left>0){toast(`验证尝试过于频繁，请 ${Math.ceil(left/1000)} 秒后重试`,'err');return;}
  openModal(`
    <div class="modal-h"><h3>${ic('shield',18)}二次验证 · ${esc(label||'敏感操作')}</h3><button class="x-btn" data-close="1">${ic('x')}</button></div>
    <div class="modal-b">
      <p style="font-size:13px;color:var(--ink-2);margin-bottom:16px">请打开 <b>Microsoft Authenticator</b>，输入应用账户当前显示的 <b>6 位验证码</b>。</p>
      <div class="field"><input class="totp-input" id="gate-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" autofocus></div>
      <div class="form-err" id="gate-err"></div>
    </div>
    <div class="modal-f"><span class="left">${ic('lock',13)}验证码 30 秒更换一次</span><button class="btn" data-close="1">取消</button><button class="btn btn-primary" id="gate-ok">验证并执行</button></div>`,
  m=>{
    const inp=$('#gate-code',m);inp.focus();
    inp.addEventListener('input',()=>inp.value=inp.value.replace(/\D/g,'').slice(0,6));
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')$('#gate-ok',m).click();});
    $('#gate-ok',m).addEventListener('click',async()=>{
      const btn=$('#gate-ok',m);btn.disabled=true;btn.textContent='验证中…';
      if(await totpVerifyCode(ses.secret,inp.value)){
        totpFails=0;closeModal();try{await action();}catch(e){toast(e&&e.message?e.message:'操作失败','err');}
      }else{
        totpFails++;inp.classList.add('err','shake');setTimeout(()=>inp.classList.remove('shake'),350);
        $('#gate-err',m).textContent='验证码不正确，请重试';
        if(totpFails>=5){lockSet('ppm.tlock',Date.now()+60000);totpFails=0;closeModal();toast('失败次数过多，二次验证已锁定 60 秒','err');}
        btn.disabled=false;btn.textContent='验证并执行';inp.focus();inp.select();}
    });
  });}

function openModal(html,onmount,cls){const m=document.createElement('div');m.className='mask';

  m.addEventListener('mousedown',e=>{if(e.target===m)closeModal();});

/* ================= 对比 ================= */
function diffLines(a,b){
  const A=a.split('\n'),B=b.split('\n'),MAX=1600;
  const truncated=A.length>MAX||B.length>MAX;
  const n=Math.min(A.length,MAX),m=Math.min(B.length,MAX);
  const dp=new Int32Array((n+1)*(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i*(m+1)+j]=A[i]===B[j]?dp[(i+1)*(m+1)+j+1]+1:Math.max(dp[(i+1)*(m+1)+j],dp[i*(m+1)+j+1]);
  const ops=[];let i=0,j=0;
  while(i<n&&j<m){if(A[i]===B[j]){ops.push([' ',A[i],i+1,j+1]);i++;j++;}
    else if(dp[(i+1)*(m+1)+j]>=dp[i*(m+1)+j+1]){ops.push(['-',A[i],i+1,null]);i++;}
    else{ops.push(['+',B[j],null,j+1]);j++;}}
  while(i<n)ops.push(['-',A[i],i+1,null]),i++;
  while(j<m)ops.push(['+',B[j],null,j+1]),j++;
  return {ops,truncated};}
function buildHunks(ops,ctx=2){
  const keep=new Array(ops.length).fill(false);let any=false;
  ops.forEach((o,i)=>{if(o[0]!==' '){any=true;for(let k=Math.max(0,i-ctx);k<=Math.min(ops.length-1,i+ctx);k++)keep[k]=true;}});
  if(!any)return [];
  const blocks=[];let i=0;
  while(i<ops.length){if(keep[i]){const s=i;while(i<ops.length&&keep[i])i++;blocks.push({s,e:i});}else i++;}
  return blocks.map((b,bi)=>({gap:b.s-(bi===0?0:blocks[bi-1].e),lines:ops.slice(b.s,b.e)}));}
function openCompare(x,y){
  if(x.at>y.at){[x,y]=[y,x];}
  const aName=(db.apps.find(v=>v.id===x.appId)||{}).name||'已删除';
  const {ops,truncated}=diffLines(x.content,y.content);
  const add=ops.filter(o=>o[0]==='+').length,del=ops.filter(o=>o[0]==='-').length;
  const hunks=buildHunks(ops);
  const diffHtml=truncated&&!hunks.length?`<div class="note">文件过大（超过 1600 行），已跳过逐行对比，请使用并排预览。</div>`
    :hunks.length?`<div class="diff">${hunks.map(h=>`
        ${h.gap?`<div class="gap">·· 中略 ${h.gap} 行未变 ··</div>`:''}
        ${h.lines.map(o=>o[0]===' '?`<div class="ln"><span class="no">${o[2]}</span><span class="tx">${esc(o[1])}</span></div>`
          :o[0]==='-'?`<div class="ln minus"><span class="no">${o[2]}</span><span class="tx">- ${esc(o[1])}</span></div>`
          :`<div class="ln plus"><span class="no">${o[3]}</span><span class="tx">+ ${esc(o[1])}</span></div>`).join('')}
      </div>`).join('')}</div>`
    :`<div class="empty" style="padding:30px">${ic('check',30)}<h3 style="font-size:15px">两个版本内容完全一致</h3></div>`;
  openModal(`
    <div class="modal-h"><h3>${ic('columns',18)}版本对比 · ${esc(aName)}</h3><button class="x-btn" data-close="1">${ic('x')}</button></div>
    <div class="modal-b">
      <div class="cmp-meta">
        <span class="snap-v">V${String(x.version).padStart(3,'0')}</span><span class="chip-tag">${fmtT(x.at)}</span><span class="chip-tag">${srcChip(x.source)}</span>
        <span style="color:var(--ink-3)">→</span>
        <span class="snap-v">V${String(y.version).padStart(3,'0')}</span><span class="chip-tag">${fmtT(y.at)}</span><span class="chip-tag">${srcChip(y.source)}</span>
        <span class="chip chip-add chip" style="margin-left:auto">+${add} 行</span><span class="chip chip-del">-${del} 行</span>
      </div>
      <div class="tabs"><button class="on" data-cmp="sbs">并排预览</button><button data-cmp="diff">文本差异</button></div>
      <div id="cmp-sbs"><div class="sbs">
        <div class="col"><h4><span>V${String(x.version).padStart(3,'0')}</span><span class="mono">${hashShort(x.contentHash)}</span></h4><iframe class="prev-frame" sandbox="" data-fr="x"></iframe></div>
        <div class="col"><h4><span>V${String(y.version).padStart(3,'0')}</span><span class="mono">${hashShort(y.contentHash)}</span></h4><iframe class="prev-frame" sandbox="" data-fr="y"></iframe></div>
      </div></div>
      <div id="cmp-diff" class="hide">${diffHtml}</div>
    </div>
    <div class="modal-f"><span class="left">${ic('shield',13)}预览已禁用脚本运行</span><button class="btn" data-close="1">关闭</button></div>`,
    m=>{

/* ================= 批量导出档案 ================= */
function buildArchive(app,ss){
  const payload={app:{name:app.name,version:app.version,url:app.url},exportedAt:Date.now(),
    snaps:ss.map(s=>({version:s.version,at:s.at,source:s.source,size:s.size,contentHash:s.contentHash,content:s.content}))};
  const json=JSON.stringify(payload).replace(/<\//g,'<\\/');
  return `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快照档案 · ${esc(app.name)}</title>
<style>body{font-family:'Noto Sans SC',system-ui,sans-serif;margin:0;background:#F5F3EC;color:#1C2740}
header{background:#152239;color:#F2F0E8;padding:22px 30px}header h1{margin:0;font-size:20px}header p{margin:6px 0 0;font-size:12px;color:#C7D1E3;font-family:monospace}
.wrap{display:flex;height:calc(100vh - 92px)}aside{width:290px;overflow:auto;border-right:1px solid #E5E0D2;background:#fff}
.item{padding:14px 18px;border-bottom:1px solid #E5E0D2;cursor:pointer;font-size:13px}.item:hover{background:#FAF8F2}.item.on{background:#FAF8F2;border-left:3px solid #B98A2F}
.item b{font-family:monospace;color:#1F3A66}.item span{display:block;color:#8B94A7;font-size:11px;margin-top:3px;font-family:monospace}
main{flex:1;padding:18px}iframe{width:100%;height:100%;border:1px solid #E5E0D2;border-radius:9px;background:#fff}
.v{font-family:monospace;font-weight:600;color:#1F3A66;background:#F5EBD4;border:1px solid #E8D9B0;border-radius:5px;padding:1px 7px;font-size:12px}
@media(max-width:760px){.wrap{flex-direction:column;height:auto}aside{width:100%}main{height:80vh}}</style></head><body>
<header><h1>${esc(app.name)} · 隐私政策快照档案</h1><p>${ss.length} SNAPSHOTS · EXPORTED ${fmtT(Date.now())} · PRIVACY POLICY REGISTRY</p></header>
<div class="wrap"><aside id="list"></aside><main><iframe id="fr" sandbox=""></iframe></main></div>
<script type="application/json" id="data">${json}<\/script>
<script>const D=JSON.parse(document.getElementById('data').textContent);const L=document.getElementById('list');
D.snaps.slice().reverse().forEach((s,i)=>{const d=document.createElement('div');d.className='item'+(i===0?' on':'');

d.onclick=()=>{document.querySelectorAll('.item').forEach(x=>x.classList.remove('on'));d.classList.add('on');document.getElementById('fr').srcdoc=s.content;};L.appendChild(d);});
document.getElementById('fr').srcdoc=D.snaps[D.snaps.length-1].content;<\/script></body></html>`;}

      <div class="field"><label>Authenticator 验证码</label><input id="cp-code" class="totp-input" style="font-size:18px;letter-spacing:8px" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></div>
      <div class="form-err" id="cp-err"></div>

    const rec=getAuth();const d=await derive(cur,rec.salt);
    if(b64(d.verifier)!==rec.verifier){err.textContent='当前密码不正确';return;}
    if(!await totpVerifyCode(ses.secret,code)){err.textContent='验证码不正确';return;}
    await saveAuthRecord(nw,ses.secret);
    await doLogin(nw);
    logAct('safe','修改了登录密码');saveDb();closeModal();toast('密码已修改','ok');});});}
function rebindModal(){
  openModal(`
    <div class="modal-h"><h3>${ic('qr',18)}重新绑定验证器</h3><button class="x-btn" data-close="1">${ic('x')}</button></div>

        ses.secret=newSecret;
        const rec=getAuth();rec.totp=await envEnc(ses.key,newSecret);
        localStorage.setItem(AUTH_KEY,JSON.stringify(rec));
        logAct('safe','重新绑定了验证器');saveDb();closeModal();toast('验证器已重新绑定','ok');return;}
      const rec=getAuth();const d=await derive($('#rb-pass',m).value,rec.salt);
      if(b64(d.verifier)!==rec.verifier){err.textContent='密码不正确';return;}
      newSecret=b32e(CR.rand(20));

      const btn=$('#rb-next',m);btn.textContent='完成绑定';
      const uri=`otpauth://totp/${encodeURIComponent('隐私政策管理台')}:${encodeURIComponent('admin')}?secret=${newSecret}&issuer=${encodeURIComponent('隐私政策管理台')}&algorithm=SHA1&digits=6&period=30`;
      const q=$('#rb-qr',m);
      if(window.QRCode){new QRCode(q,{text:uri,width:150,height:150,correctLevel:QRCode.CorrectLevel.M});}

    });});}

/* ================= 登录 / 初始化界面 ================= */
function ctxNote(){return CR.native?'':`<div class="note" style="margin-top:10px">当前为非安全上下文（HTTP），已自动启用内置加密后备实现，功能不受影响；正式部署建议通过 HTTPS 访问。</div>`;}
function qrInto(el,uri){if(window.QRCode){new QRCode(el,{text:uri,width:158,height:158,correctLevel:QRCode.CorrectLevel.M});}
  else{el.innerHTML='<div style="width:158px;height:158px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8B94A7;text-align:center;padding:12px;border:1px dashed var(--line-2);border-radius:8px">二维码组件加载失败<br>请使用下方密钥手动添加</div>';}}
function renderLogin(){
  const card=$('#gate-card');
  let fails=0;
  card.innerHTML=`
    <div class="gate-brand">
      <svg width="44" height="44" viewBox="0 0 44 44"><rect width="44" height="44" rx="9" fill="#B23B2E"/><text x="22" y="31" text-anchor="middle" font-size="23" fill="#F6F4EC" font-family="Noto Serif SC,serif" font-weight="900">隐</text></svg>
      <div><h1>隐私政策管理台</h1><div class="en">PRIVACY POLICY REGISTRY</div></div>
    </div>
    <p class="gate-sub">统一维护各端隐私政策 · 快照留存 · 版本追溯</p>
    <form id="login-f">

  paintIcons(card);
  const doSubmit=async()=>{
    const until=lockGet('ppm.llock');const left=until-Date.now();

    else{fails++;$('#lg-err').textContent='密码不正确';$('#lg-pass').value='';$('#lg-pass').focus();
      if(fails>=5){lockSet('ppm.llock',Date.now()+60000);fails=0;$('#lg-err').textContent='失败次数过多，已锁定 60 秒';}
      btn.disabled=false;btn.innerHTML=`${ic('lock',14)}解锁管理台`;}};
  $('#login-f').addEventListener('submit',e=>{e.preventDefault();doSubmit();});
  $('#lg-pass').focus();}

    <div class="gate-note">${ic('shield',12)} 密码以 PBKDF2（SHA-256，150,000 轮）派生存储，绝不明文保存；验证器密钥经认证加密封装存储。全部数据仅保存在当前浏览器。${ctxNote()}</div>`;
  paintIcons(card);

function enterApp(actText){
  $('#gate').classList.add('hide');$('#shell').classList.remove('hide');

/* ================= 事件绑定 ================= */
document.addEventListener('click',e=>{
  if(e.target.closest('a[href]'))return;
  const act=e.target.closest('[data-act]');
  if(act){const fn=ACT[act.dataset.act];if(fn){e.stopPropagation();fn(act.dataset);return;}}
  const go=e.target.closest('[data-go]');
  if(go){nav(go.dataset.go);return;}
  const open=e.target.closest('[data-open-app]');
  if(open){nav('#/app/'+open.dataset.openApp);return;}});
document.addEventListener('change',e=>{
  const selInp=e.target.closest('[data-sel-snap]');
  if(selInp){const id=selInp.dataset.selSnap;
    if(selInp.checked){if(sel.size>=2){toast('最多选择两个版本进行对比','err');selInp.checked=false;return;}sel.add(id);}
    else sel.delete(id);
    render();return;}
  if(e.target.id==='file-in'&&e.target.files.length)handleUpload(e.target.files[0]);
  if(e.target.id==='imp-in'&&e.target.files.length)handleImport(e.target.files[0]);
  if(e.target.id==='flt-app'){snapFilterApp=e.target.value;sel.clear();render();}
  if(e.target.id==='flt-src'){snapFilterSrc=e.target.value;sel.clear();render();}});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.activeElement&&document.activeElement.classList.contains('totp-input')){
    const m=document.activeElement.closest('.mask');
    const btn=m&&m.querySelector('#gate-ok,#wz-done,#rb-next');if(btn)btn.click();}});
async function handleUpload(file){
  const app=db.apps.find(a=>a.id===pendingUpload);pendingUpload=null;
  if(!app){toast('上传会话已失效，请重试','err');return;}
  if(!/\.html?$/i.test(file.name)){toast('仅支持 .html / .htm 文件','err');return;}
  const content=await file.text();
  if(!content.trim()){toast('文件内容为空','err');return;}
  const v=await createSnapshot(app,content,'upload');
  toast(`已上传并生成快照 V${String(v).padStart(3,'0')}`,'ok');
  const dom=db.settings.domain;
  if(dom){const pub=`${dom.replace(/\/+$/,'')}/${slugOf(app)}/privacy.html`;
    openModal(`
      <div class="modal-h"><h3>${ic('upload',18)}上传成功 · 快照 V${String(v).padStart(3,'0')}</h3><button class="x-btn" data-close="1">${ic('x')}</button></div>
      <div class="modal-b">
        <p style="font-size:13.5px;color:var(--ink-2);line-height:1.9">快照已存档。请将此 HTML 文件部署到自定义域名路径，使线上内容与存档一致：</p>
        <div class="secret-key" style="cursor:copy" id="pub-path" title="点击复制">${esc(pub)}</div>
        <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-top:14px;cursor:pointer">
          <input type="checkbox" id="pub-upd" checked style="accent-color:var(--navy)">同时将该应用的在线链接更新为上述发布路径
        </label>
      </div>
      <div class="modal-f"><button class="btn" data-close="1">稍后部署</button><button class="btn btn-primary" id="pub-ok">保存</button></div>`,
    m=>{
      $('#pub-path',m).addEventListener('click',()=>copyText(pub));
      $('#pub-ok',m).addEventListener('click',()=>{
        if($('#pub-upd',m).checked){app.url=pub;logAct('set',`「${app.name}」在线链接已更新为发布路径`);}
        saveDb();closeModal();render();toast('已完成','ok');});});}
  else render();}
async function handleImport(file){
  try{
    const obj=JSON.parse(await file.text());
    if(obj.v!==1||!Array.isArray(obj.apps)||!Array.isArray(obj.snapshots))throw new Error('format');
    const mode=await new Promise(res=>{
      openModal(`
        <div class="modal-h"><h3>${ic('upload',18)}导入备份</h3><button class="x-btn" data-close="1">${ic('x')}</button></div>
        <div class="modal-b"><p style="font-size:13.5px;color:var(--ink-2);line-height:1.9">备份包含 <b>${obj.apps.length}</b> 个应用、<b>${obj.snapshots.length}</b> 份快照。请选择导入方式：</p></div>
        <div class="modal-f"><button class="btn" id="im-mg">合并导入</button><button class="btn btn-danger" id="im-rp">覆盖现有数据</button></div>`,
      m=>{$('#im-mg',m).addEventListener('click',()=>{closeModal();res('merge');});
          $('#im-rp',m).addEventListener('click',()=>{closeModal();res('replace');});});});
    if(!mode)return;
    if(mode==='replace'){db.apps=obj.apps;db.snapshots=obj.snapshots;db.settings=obj.settings||db.settings;db.activity=obj.activity||[];}
    else{const idmap={};
      for(const a of obj.apps){if(db.apps.some(x=>x.id===a.id)){const nid=uid();idmap[a.id]=nid;a.id=nid;}db.apps.push(a);}
      for(const s of obj.snapshots){if(idmap[s.appId])s.appId=idmap[s.appId];if(db.snapshots.some(x=>x.id===s.id))s.id=uid();db.snapshots.push(s);}}
    logAct('set',`导入了备份（${mode==='merge'?'合并':'覆盖'}）：${obj.apps.length} 个应用 / ${obj.snapshots.length} 份快照`);
    saveDb();render();toast('备份已导入','ok');
  }catch(e){toast('备份文件无效或已损坏','err');}}

/* ================= 启动 ================= */
function tick(){const c=$('#clock');if(c)c.textContent=fmtT(Date.now());}
function init(){
  loadDb();paintIcons();
  const rec=getAuth();
  if(!rec)renderWizard();else renderLogin();
  setInterval(tick,1000);tick();
  window.addEventListener('hashchange',()=>{sel.clear();render();});}
init();
</script>
